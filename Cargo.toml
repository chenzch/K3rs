[package]
name = "K3rs"
version = "0.1.0"
edition = "2021"
description = "Native Rust bare-metal firmware for NXP S32K312 (Cortex-M7)"

[[bin]]
name = "K3rs"
path = "src/main.rs"

[dependencies]
# Standard Cortex-M support (Cortex-M7): interrupt traits, register primitives,
# and a single-core critical-section backend (PRIMASK-based).
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# VolatileCell used by svd2rust-generated register definitions.
vcell = "0.1.3"
# critical-section 1.x API (backend provided by cortex-m feature above).
critical-section = "1.2.0"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
debug = true
strip = false
